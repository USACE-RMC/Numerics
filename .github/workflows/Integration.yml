name: Integration

on:
  pull_request:
    branches: [ main ]

jobs:
  CI:
    # Preserve the check name used by the previous reusable workflow.
    name: CI / CI
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        env:
          VSTEST_CONNECTION_TIMEOUT: '600'
        # Live provider outages and full-record download timeouts must not block PRs.
        # Keep deterministic download, parsing, validation, and numerical tests in the gate.
        run: dotnet test -c Release --no-build --filter "TestCategory!=LiveServiceIntegration"

      - name: Pack and validate against the baseline release
        # Package validation compares the public API with PackageValidationBaselineVersion on nuget.org.
        run: dotnet pack Numerics/Numerics.csproj -c Release --no-build -o ./packages
