name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Run from main to retry an existing tag with the current workflow.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to publish to Nexus (for example, v2.3.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.release_tag) || github.sha }}

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Create version number
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          $TAG = $env:RELEASE_TAG
          $VERSION = $TAG -replace '^v', ''
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV

      - name: Build
        shell: pwsh
        run: dotnet build Numerics/Numerics.csproj -c Release /p:Version=$env:VERSION

      - name: Test
        env:
          VSTEST_CONNECTION_TIMEOUT: '600'
        # Keep the same deterministic gate as PR integration; provider outages must not block releases.
        run: dotnet test -c Release --filter "TestCategory!=LiveServiceIntegration"

      - name: Pack
        shell: pwsh
        run: dotnet pack Numerics/Numerics.csproj --configuration Release /p:Version=$env:VERSION --no-build -o ./packages

      - name: Publish
        shell: pwsh
        run: dotnet nuget push "**/*.nupkg" --api-key ${{ secrets.NEXUS_NUGET_APIKEY }} --source "https://www.hec.usace.army.mil/nexus/repository/consequences-nuget-public/" --skip-duplicate
