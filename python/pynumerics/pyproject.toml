# pynumerics: the RMC.Numerics assembly for Python, with the single CoreCLR loader and typed wrappers.
# The distribution version equals the RMC.Numerics NuGet version of the bundled Numerics.dll
# (src/pynumerics/_version.py); scripts/build_wheel.py stages the assembly and checks its SHA-256.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pynumerics"
dynamic = ["version"]
description = "RMC.Numerics for Python: probability distributions, statistics, MCMC, optimization and numerical methods from the USACE-RMC Numerics library."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "Haden Smith", email = "cole.h.smith@usace.army.mil" }]
keywords = ["statistics", "probability distributions", "hydrology", "flood frequency analysis", "L-moments", "MCMC", "optimization", "Monte Carlo", "uncertainty analysis", "pythonnet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Hydrology",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "pythonnet>=3.1,<3.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8", "numpydoc>=1.8", "ruff>=0.6", "scipy>=1.11", "statsmodels>=0.14", "scikit-learn>=1.3", "shapely>=2.0", "arviz>=0.17,<1",
        "dataretrieval>=1.4", "wetterdienst>=0.184", "kiwis-pie>=0.10.5"]
docs = ["sphinx>=8,<10", "numpydoc>=1.8", "myst-parser>=4"]

[project.urls]
Homepage = "https://github.com/USACE-RMC/Numerics"
Documentation = "https://github.com/USACE-RMC/Numerics/tree/main/python/pynumerics/docs"
Repository = "https://github.com/USACE-RMC/Numerics"
Issues = "https://github.com/USACE-RMC/Numerics/issues"
Changelog = "https://github.com/USACE-RMC/Numerics/blob/main/python/pynumerics/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "pynumerics._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# _bin/ holds pynumerics.runtimeconfig.json (tracked) and Numerics.dll, which
# scripts/build_wheel.py stages from the RMC.Numerics NuGet package (gitignored).
pynumerics = ["py.typed", "_bin/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["benchmark: wall-clock timing assertions, deselected by default; run them with -m benchmark"]
addopts = "-m 'not benchmark'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
